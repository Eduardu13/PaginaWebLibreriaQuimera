<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Librería Quimera</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">

    <!-- Css global -->
    <link rel="stylesheet" href="global.css">
    
    <link rel="stylesheet" href="styleofertas.css">

    <link rel="stylesheet" href="stylecatalogo.css">

    <!-- Y CON ESTO SE PUEDO "VER" LOS ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ---------------------------- -->
</head>
<body>
    
    <div class="ColorBarraDeActividades">
        <div class="BarraDeActividadesMargen">
            <div class="FilaSuperior">
                <div class="LogoYTitulo">
                    <img src="LechuzaLogo.png" class="logo">
                    <a>    
                        <h3 style="color: white"> Libreria <br> Quimera</h3>
                    </a>
                </div>

                <div class="BuscadorHeader">
                    <form>
                        <input type="search" name="q" placeholder="Título, Autor o ISBN">
                        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
                </div>

                <div class="AccionesUsuario">
                    <a href="usuario.html" class="BotonUsuario">
                        <i class="fa-solid fa-user"> </i> <span style="margin-left: 10px;">Mi cuenta</span>
                    </a>

                    <a href="carrito.html" class="BotonCarro">
                        <i class="fa-solid fa-cart-arrow-down"> </i> <span style="margin-left: 10px;">Carrito </span> <span id="numerito" class="numerito"> 0 </span>
                    </a>
                </div>
            </div>

            <div class="FilaInferior">
                <nav class="BarraDeActividades">
                    <a href="index.html">Inicio</a>
                    <a href="ofertas.html" style="color: rgb(188, 2, 2);"><strong>¡Ofertas!</strong></a>
                    <a href="catalogo.html">Catalogo</a>
                    <a href="novedades.html">Novedades</a>
                    <a href="contacto.html">Contacto</a>
                </nav>
            </div>
        </div>
    </div>

    <div class="ColorCuerpo">
        <div class="ContenedorOfertas">
            <h2 class="TituloOfertas">Libros con Descuentos Especiales</h2>
            <div class="GridOfertas" id="gridOfertas"></div>
        </div>
    </div>

    <script src="scriptCatalogo.js"></script>
    <script src="scriptBotonTarjetas.js"></script>
    <script src="scriptBarRebelde.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const gridOfertas = document.getElementById("gridOfertas");
        if (!gridOfertas) return;

        gridOfertas.innerHTML = `<p style="text-align:center;width:100%;">Cargando ofertas...</p>`;

        function obtenerCarritoLS() {
            const raw = localStorage.getItem("libros-en-carrito");
            if (!raw) return [];
            try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function guardarCarritoLS(carrito) {
            localStorage.setItem("libros-en-carrito", JSON.stringify(carrito));
            const total = carrito.reduce((acc, prod) => acc + (Number(prod.cantidad) || 1), 0);
            const num = document.getElementById("numerito");
            if (num) num.innerText = total;
        }

        guardarCarritoLS(obtenerCarritoLS());

        try {
            const resp = await fetch("https://localhost:7270/api/admin/secciones-libros");
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            const items = await resp.json();
            const ofertas = (Array.isArray(items) ? items : []).filter(item => item.seccion === "ofertas");

            if (ofertas.length === 0) {
                gridOfertas.innerHTML = `<p style="text-align:center;width:100%;">Por el momento no hay libros en oferta.</p>`;
                return;
            }

            gridOfertas.innerHTML = ofertas.map(item => {
                const precioNormal = Number(item.precio || 0);
                const precioOfertaBD = item.precioOferta != null && item.precioOferta !== ""
                    ? Number(item.precioOferta)
                    : null;
                const descuentoBD = item.descuento != null && item.descuento !== ""
                    ? Number(item.descuento)
                    : null;

                let precioFinal = precioNormal;
                let pct = 0;

                if (descuentoBD != null && !Number.isNaN(descuentoBD) && descuentoBD > 0) {
                    pct = descuentoBD;
                    precioFinal = precioOfertaBD != null && !Number.isNaN(precioOfertaBD)
                        ? precioOfertaBD
                        : precioNormal * (1 - descuentoBD / 100);
                } else if (precioOfertaBD != null && !Number.isNaN(precioOfertaBD)) {
                    precioFinal = precioOfertaBD;
                    if (precioNormal > 0 && precioOfertaBD < precioNormal) {
                        pct = Math.round(((precioNormal - precioOfertaBD) / precioNormal) * 100);
                    }
                }

                const tieneDescuento = precioFinal < precioNormal;
                const ahorro = tieneDescuento ? precioNormal - precioFinal : 0;

                const etiquetaDesc = tieneDescuento
                    ? `<span class="EtiquetaDescuento">-${pct || Math.round((ahorro / precioNormal) * 100)}%</span>`
                    : `<span class="EtiquetaDescuento">OFERTA</span>`;

                const tituloEscapado = (item.titulo || "").replace(/"/g, "&quot;");
                const autorEscapado = (item.autor || "").replace(/"/g, "&quot;");
                const imagenEscapada = (item.imagen || "").replace(/"/g, "&quot;");

                return `
                    <div class="TarjetaOferta">
                        ${etiquetaDesc}
                        <img src="${imagenEscapada}" alt="Portada de ${tituloEscapado}" class="Oferta-Img">
                        <div class="Oferta-Info">
                            <h3 class="titulo-libro">${item.titulo}</h3>
                            <p class="autor-libro">${item.autor}</p>
                            <div class="PreciosContenedor">
                                ${tieneDescuento ? `<span class="PrecioViejo">$${precioNormal.toFixed(2)}</span>` : ""}
                                <span class="PrecioNuevo">$${precioFinal.toFixed(2)}</span>
                            </div>
                            ${tieneDescuento ? `<small style="display:block;margin-bottom:8px;">Descuento: -$${ahorro.toFixed(2)}</small>` : ""}
                            <button
                                type="button"
                                class="producto-agregar"
                                data-id="${item.idLibro}"
                                data-titulo="${tituloEscapado}"
                                data-autor="${autorEscapado}"
                                data-precio="${Number(precioFinal.toFixed(2))}"
                                data-imagen="${imagenEscapada}"
                            >AGREGAR</button>
                        </div>
                    </div>
                `;
            }).join("");

            gridOfertas.querySelectorAll(".producto-agregar").forEach(btn => {
                btn.addEventListener("click", () => {
                    const id = btn.dataset.id;
                    const titulo = btn.dataset.titulo;
                    const autor = btn.dataset.autor;
                    const precio = Number(btn.dataset.precio || 0);
                    const imagen = btn.dataset.imagen;

                    const desdeCatalogo = Array.isArray(window.LibrosArray)
                        ? window.LibrosArray.find(l => String(l.id) === String(id))
                        : null;

                    const carrito = obtenerCarritoLS();
                    const indice = carrito.findIndex(p => String(p.id) === String(id));

                    if (indice !== -1) {
                        carrito[indice].cantidad = (Number(carrito[indice].cantidad) || 1) + 1;
                        carrito[indice].precio = precio;
                    } else {
                        carrito.push({
                            ...(desdeCatalogo || {}),
                            id,
                            titulo,
                            autor,
                            precio,
                            imagen,
                            cantidad: 1
                        });
                    }

                    guardarCarritoLS(carrito);
                    alert(`¡"${titulo}" se agregó a tu carrito correctamente!`);
                });
            });
        } catch (err) {
            console.error("Error cargando ofertas:", err);
            gridOfertas.innerHTML = `<p style="text-align:center;width:100%;">No se pudieron cargar las ofertas en este momento.</p>`;
        }
    });
    </script>
</body>
</html>
